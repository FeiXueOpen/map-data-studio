[package]
name = "map-data-studio"
version = "0.1.1"
description = "Map Data Studio desktop application"
authors = ["Map Data Studio"]
edition = "2021"

[lib]
name = "map_data_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.5", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
tokio = { version = "1", features = ["sync", "time", "net", "macros"] }
tauri-plugin-dialog = "2"

hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
sha2 = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
